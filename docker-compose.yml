services:
  app:
    build: .
    image: ld-sportsbook-demo
    ports:
      - "3000:3000"
    # LaunchDarkly keys are read from .env at runtime, never baked into the image.
    env_file: .env
    environment:
      # Always listen on 3000 inside the container, whatever PORT is in .env.
      PORT: "3000"
    # Runs a tiny init process as PID 1 that forwards signals to node, so
    # `docker stop` shuts down immediately instead of waiting 10s.
    init: true
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl, so use Node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

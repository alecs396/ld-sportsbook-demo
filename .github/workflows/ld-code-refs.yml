# Sends LaunchDarkly the places in this repo that reference each flag, so a
# flag's Code references tab shows where it's used (handy for flag cleanup).
# Setup (see README):
#   - Repo secret LD_ACCESS_TOKEN: a LaunchDarkly API token that can write code references.
#   - Optional repo variable LD_PROJECT_KEY: your LaunchDarkly project key.
name: LaunchDarkly code references

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find-code-references:
    name: Find LaunchDarkly code references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scanner looks back through recent commits to spot removed references.
          fetch-depth: 11

      - uses: launchdarkly/find-code-references@v2.18.0
        with:
          accessToken: ${{ secrets.LD_ACCESS_TOKEN }}
          projKey: ${{ vars.LD_PROJECT_KEY || 'ld-sportsbook-demo' }}
